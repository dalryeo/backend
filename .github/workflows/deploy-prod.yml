name: Deploy backend-api-prod (prod)

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  ACR_RESOURCE_NAME: ${{ vars.ACR_RESOURCE_NAME }}
  ACR_LOGIN_SERVER: ${{ vars.ACR_LOGIN_SERVER }}
  RESOURCE_GROUP: ${{ vars.RESOURCE_GROUP }}
  CONTAINER_APP_NAME: ${{ vars.CONTAINER_APP_NAME }}
  IMAGE_NAME: ${{ vars.IMAGE_NAME }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: prod

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Ensure Azure CLI extensions
        run: |
          az config set extension.use_dynamic_install=yes_without_prompt

      - name: Debug ACR discovery
        run: |
          set -euxo pipefail
          az account show --query "{name:name, id:id, tenantId:tenantId}" -o json
          az acr show -n $ACR_RESOURCE_NAME --query "{name:name, loginServer:loginServer, resourceGroup:resourceGroup}" -o json

      - name: Docker login to ACR (token)
        run: |
          set -euxo pipefail
          az account set --subscription "${{ secrets.AZURE_SUBSCRIPTION_ID }}"
          ACR_LOGIN_VALUE=$(az acr login --name $ACR_RESOURCE_NAME --expose-token --output tsv --query accessToken)
          echo "$ACR_LOGIN_VALUE" | docker login $ACR_LOGIN_SERVER --username 00000000-0000-0000-0000-000000000000 --password-stdin

      - name: Build and Push Docker image
        run: |
          IMAGE_TAG=${{ github.sha }}
          docker build -t $ACR_LOGIN_SERVER/$IMAGE_NAME:$IMAGE_TAG .
          docker push $ACR_LOGIN_SERVER/$IMAGE_NAME:$IMAGE_TAG
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV

      - name: Update Container App image
        run: |
          az containerapp update \
            --name $CONTAINER_APP_NAME \
            --resource-group $RESOURCE_GROUP \
            --image $ACR_LOGIN_SERVER/$IMAGE_NAME:${{ env.IMAGE_TAG }}