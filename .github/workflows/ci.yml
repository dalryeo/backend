name: Backend Verify

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: dalryeo_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dalryeo_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DB_URL: jdbc:postgresql://localhost:5432/dalryeo_test
      TEST_DB_USERNAME: postgres
      TEST_DB_PASSWORD: postgres

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Collect changed files
        run: |
          set -euo pipefail
          if [[ -n "${GITHUB_BASE_REF:-}" ]]; then
            git diff --name-only "origin/${GITHUB_BASE_REF}...HEAD" > changed-files.txt
          else
            git diff --name-only HEAD~1..HEAD > changed-files.txt
          fi

      - name: Run harness checks
        run: |
          set -euo pipefail
          bash scripts/test-harness-checks.sh
          bash scripts/docs-lint.sh
          bash scripts/check-sensitive-paths.sh --tracked

      - name: Check PR contract
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          bash scripts/check-pr-contract.sh --changed-files changed-files.txt

      - name: Run tests
        run: ./scripts/test-local.sh
